# ANNY Actor Schema - Defines the structure of actor records
schema_version: "1.0"
required_fields:
  - actor_id
  - actor_type
  - name
  - role
  - department
  - level
  - authority_level
  - status
optional_fields:
  - authority_scope
  - parent_director
  - capabilities
  - description
  - created_at
  - created_by
valid_actor_types:
  - system
  - director
  - worker
valid_levels:
  - L0
  - L1
  - L2
valid_authority_levels:
  - L0
  - L1
  - L2
valid_statuses:
  - ACTIVE
  - INACTIVE
  - SUSPENDED
